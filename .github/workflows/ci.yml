name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- JS gates ---------------------------------------------------------
      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: WXT build (chrome-mv3)
        run: npm run build

      - name: Package zip
        run: npm run zip
