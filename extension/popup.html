<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube LineStack Studio</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body class="popup">
  <div class="app">
    <main class="main">
      <section class="card">
        <div class="card__body">
          <div class="stat"><span>Stored frames</span><strong id="count">0</strong></div>
          <div class="actions" style="margin-top:10px">
            <button id="captureBtn" data-icon="capture">Capture frame</button>
            <button class="secondary" id="panelBtn" data-icon="studio">Open studio</button>
            <button class="ghost wide danger" id="clearBtn" data-icon="trash">Clear frames</button>
          </div>
          <div id="status" class="status" style="margin-top:10px">Open a YouTube tab, then capture.</div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
