<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube LineStack Studio</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body class="sidepanel">
  <div class="app">

    <!-- ========== CAPTURE BAR ========== -->
    <header class="capture-bar">
      <button id="captureBtn" class="capture-btn" data-icon="capture">Capture</button>
      <button id="autoBtn" class="secondary auto-btn" data-icon="play">Auto</button>
      <button id="uploadBtn" class="secondary" data-icon="image-add" title="Add image — or paste / drop">Add</button>
      <input type="file" id="uploadInput" accept="image/png,image/jpeg,image/webp" hidden>
      <div class="capture-bar__spacer"></div>
      <div class="capture-bar__field">
        <label for="interval">Every</label>
        <input id="interval" type="number" min="0.5" max="60" step="0.5" value="1" class="interval-input" aria-label="Capture interval in seconds">
        <span aria-hidden="true">s</span>
      </div>
      <span id="status" class="status">Ready.</span>
      <a href="https://buymeacoffee.com/leovoon" target="_blank" rel="noopener" class="bmc-link" title="Buy me a coffee" aria-label="Buy me a coffee">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 010 8h-1"/>
          <path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/>
          <line x1="6" y1="1" x2="6" y2="4"/>
          <line x1="10" y1="1" x2="10" y2="4"/>
          <line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
      </a>
    </header>

    <!-- ========== MODE SWITCH + EXPORT SETTINGS ========== -->
    <div class="toolbar">
      <div class="mode-switch" role="tablist" aria-label="Export mode">
        <button class="mode-switch__btn active" data-mode="linestack" role="tab" aria-selected="true">LineStack</button>
        <button class="mode-switch__btn" data-mode="collage" role="tab" aria-selected="false">Collage</button>
      </div>

      <!-- LineStack settings (inline, compact) -->
      <div class="settings-inline" data-settings="linestack">
        <div class="si-field">
          <label>Width</label>
          <select id="stackWidth"><option value="720">720</option><option value="1080" selected>1080</option></select>
        </div>
        <div class="si-field">
          <label>Preset</label>
          <select id="defaultCaptureType">
            <option value="keyframe">Scene</option>
            <option value="subtitle" selected>Subtitle</option>
          </select>
        </div>
        <div class="si-field">
          <label>Top %</label>
            <input id="defaultCropTop" type="number" value="80" min="0" max="90" step="1" class="num-sm">
        </div>
        <div class="si-field">
          <label>Bot %</label>
            <input id="defaultCropBottom" type="number" value="0" min="0" max="90" step="1" class="num-sm">
        </div>
        <div class="si-field si-field--grow">
          <label>Watermark</label>
          <input id="stackWatermark" type="text" placeholder="e.g. @channelname">
        </div>
      </div>

      <!-- Collage settings (inline, compact) -->
      <div class="settings-inline" data-settings="collage" hidden>
        <div class="si-field">
          <label>Layout</label>
          <select id="collageLayout"><option value="grid" selected>Grid</option><option value="masonry">Masonry</option><option value="strip">Strip</option></select>
        </div>
        <div class="si-field">
          <label>Cols</label>
          <input id="collageColumns" type="number" value="2" min="1" max="6" class="num-sm">
        </div>
        <div class="si-field">
          <label>Aspect</label>
          <select id="collageAspect"><option value="1.7778" selected>16:9</option><option value="1">1:1</option><option value="1.3333">4:3</option><option value="0.8">4:5</option><option value="0.5625">9:16</option></select>
        </div>
        <div class="si-field">
          <label>Width</label>
          <select id="collageWidth"><option value="720">720</option><option value="1080" selected>1080</option><option value="1440">1440</option></select>
        </div>
        <div class="si-field">
          <label>Gap</label>
          <input id="collageGap" type="number" value="10" min="0" max="80" class="num-sm">
        </div>
        <div class="si-field">
          <label>Radius</label>
          <input id="collageRadius" type="number" value="10" min="0" max="80" class="num-sm">
        </div>
        <div class="si-field">
          <label>BG</label>
          <input id="collageBg" type="color" value="#111111" class="color-sm">
        </div>
      </div>
    </div>

    <!-- ========== OUTPUT (the editing surface) ========== -->
    <section class="output-section">
      <div class="output-head">
        <small id="previewLabel">live</small>
        <div class="zoombar" role="group" aria-label="Zoom">
          <button class="iconbtn" id="zoomOutBtn" title="Zoom out">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
          <button class="iconbtn zoom-value" id="zoomResetBtn" title="Reset zoom">100%</button>
          <button class="iconbtn" id="zoomInBtn" title="Zoom in">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
        </div>
      </div>

      <!-- LineStack: DOM-based editable strip -->
      <div id="outputStrip" class="output-strip"></div>

      <!-- Collage: canvas-rendered preview with block overlay -->
      <div id="previewContainer" class="preview-container" hidden>
        <div class="preview-stage" id="previewStage">
          <img id="previewImg" draggable="false">
          <div class="block-overlay" id="blockOverlay"></div>
        </div>
      </div>

      <!-- Empty state -->
      <div id="emptyState" class="empty-state"></div>
    </section>

    <!-- ========== EXPORT FOOTER (fixed) ========== -->
    <div class="footer-dock">
      <footer class="export-footer">
        <button id="downloadExportBtn" data-icon="download" class="export-btn wide" disabled>Download LineStack</button>
        <button id="clearBtn" data-icon="trash" class="ghost danger clear-btn">Clear all</button>
      </footer>
    </div>
  </div>

  <!-- Collage block editor (bottom sheet) -->
  <aside class="block-editor" id="blockEditor" hidden>
    <div class="block-editor__head">
      <strong id="blockTitle">Block</strong>
      <div class="block-editor__head-actions">
        <button class="ghost" id="blockReset" data-icon="reset">Reset</button>
        <button class="ghost block-close" id="blockClose" title="Close">✕</button>
      </div>
    </div>
    <div class="block-editor__group" id="blockSizeGroup">
      <div class="settings-row">
        <div class="settings-field">
          <label>Width (cols) <span id="spanLabel">1</span></label>
          <input id="blockSpan" type="range" min="1" max="6" step="1" value="1">
        </div>
        <div class="settings-field">
          <label>Height <span id="heightLabel">1.0×</span></label>
          <input id="blockHeight" type="range" min="0.4" max="2.5" step="0.05" value="1">
        </div>
      </div>
    </div>
    <div class="settings-row">
      <div class="settings-field">
        <label>Zoom <span id="zoomLabel">1.0×</span></label>
        <input id="blockZoom" type="range" min="1" max="4" step="0.05" value="1">
      </div>
    </div>
    <div class="settings-row">
      <div class="settings-field">
        <label>Pan X</label>
        <input id="blockOffsetX" type="range" min="-1" max="1" step="0.02" value="0">
      </div>
      <div class="settings-field">
        <label>Pan Y</label>
        <input id="blockOffsetY" type="range" min="-1" max="1" step="0.02" value="0">
      </div>
    </div>
    <div class="block-editor__group">
      <div class="settings-row">
        <div class="settings-field settings-field--grow">
          <label>Caption <small id="frameCaptionHint"></small></label>
          <textarea id="frameCaption" rows="2" placeholder="Add caption…"></textarea>
        </div>
      </div>
      <div class="settings-row">
        <div class="settings-field">
          <label>Type</label>
          <select id="frameType"><option value="keyframe">Scene</option><option value="subtitle">Subtitle</option></select>
        </div>
        <div class="settings-field">
          <label>Caption size <span id="frameCaptionScaleLabel">1.0×</span></label>
          <input id="frameCaptionScale" type="range" min="0.5" max="2" step="0.1" value="1">
        </div>
      </div>
      <div class="frame-editor__actions">
        <button class="ghost" id="frameEarlier" title="Move earlier">← Earlier</button>
        <button class="ghost" id="frameLater" title="Move later">Later →</button>
        <button class="danger" id="frameDelete">Delete</button>
      </div>
    </div>
  </aside>

  <script src="core.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
