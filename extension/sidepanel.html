<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube LineStack Studio</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body class="sidepanel">
  <div class="app">
    <!-- ========== CAPTURE BAR ========== -->
    <header class="capture-bar">
      <div class="capture-bar__left">
        <button id="captureBtn" data-icon="capture" class="capture-btn">Capture</button>
        <button id="autoBtn" data-icon="play" class="secondary auto-btn">Auto</button>
        <button id="uploadBtn" data-icon="image-add" class="secondary" title="Add image — or paste / drop">Add</button>
        <input type="file" id="uploadInput" accept="image/png,image/jpeg,image/webp" hidden>
      </div>
      <div class="capture-bar__right">
        <div class="capture-bar__field">
          <label for="interval">Every</label>
          <input id="interval" type="number" min="0.5" max="60" step="0.5" value="1" class="interval-input">
          <span>s</span>
        </div>
        <div class="capture-bar__field">
          <label for="captureRule">Rule</label>
          <select id="captureRule">
            <option value="caption-aware" selected>Caption-aware</option>
            <option value="first-keyframe">First keyframe</option>
            <option value="all-subtitle">All subtitle</option>
          </select>
        </div>
      </div>
    </header>

    <div id="status" class="status">Ready.</div>

    <!-- ========== PREVIEW ========== -->
    <section class="preview-section">
      <div class="preview-head">
        <div class="mode-switch" role="tablist">
          <button class="mode-switch__btn active" data-mode="linestack" role="tab">LineStack</button>
          <button class="mode-switch__btn" data-mode="collage" role="tab">Collage</button>
        </div>
        <div class="preview-tools">
          <small id="previewLabel">live</small>
          <div class="zoombar" role="group" aria-label="Preview zoom">
            <button class="iconbtn" id="zoomOutBtn" data-icon="zoom-out" title="Zoom out"></button>
            <button class="iconbtn zoom-value" id="zoomResetBtn" title="Reset / fit">100%</button>
            <button class="iconbtn" id="zoomInBtn" data-icon="zoom-in" title="Zoom in"></button>
          </div>
        </div>
      </div>
      <div class="preview" id="preview">
        <p class="empty">Capture frames — the preview updates automatically.</p>
      </div>
    </section>

    <!-- ========== EXPORT SETTINGS (inline) ========== -->
    <section class="export-settings" id="exportSettings">
      <!-- LineStack settings -->
      <div class="settings-panel" data-settings="linestack">
        <div class="settings-row">
          <div class="settings-field">
            <label>Width</label>
            <select id="stackWidth"><option value="720">720</option><option value="1080" selected>1080</option></select>
          </div>
          <div class="settings-field settings-field--range">
            <label>Subtitle crop <span id="ratioLabel">20%</span></label>
            <input id="bottomKeepRatio" type="range" min="0.08" max="0.45" step="0.01" value="0.20">
          </div>
          <div class="settings-field">
            <label>Gap</label>
            <div class="settings-group">
              <select id="enableGap"><option value="false" selected>Off</option><option value="true">On</option></select>
              <input id="gapSize" type="number" value="8" min="0" max="80" class="num-sm">
            </div>
          </div>
          <div class="settings-field">
            <label>Quality</label>
            <input id="stackQuality" type="number" min="0.5" max="1" step="0.05" value="0.9" class="num-sm">
          </div>
        </div>
        <div class="settings-row">
          <div class="settings-field settings-field--grow">
            <label>Watermark</label>
            <input id="stackWatermark" type="text" placeholder="optional">
          </div>
        </div>
      </div>

      <!-- Collage settings -->
      <div class="settings-panel" data-settings="collage" hidden>
        <div class="settings-row">
          <div class="settings-field">
            <label>Layout</label>
            <select id="collageLayout">
              <option value="grid" selected>Grid</option>
              <option value="masonry">Masonry</option>
              <option value="strip">Strip</option>
            </select>
          </div>
          <div class="settings-field">
            <label>Columns</label>
            <input id="collageColumns" type="number" value="2" min="1" max="6" class="num-sm">
          </div>
          <div class="settings-field">
            <label>Aspect</label>
            <select id="collageAspect">
              <option value="1.7778" selected>16:9</option>
              <option value="1">1:1</option>
              <option value="1.3333">4:3</option>
              <option value="0.8">4:5</option>
              <option value="0.5625">9:16</option>
            </select>
          </div>
          <div class="settings-field">
            <label>Width</label>
            <select id="collageWidth"><option value="720">720</option><option value="1080" selected>1080</option><option value="1440">1440</option></select>
          </div>
        </div>
        <div class="settings-row">
          <div class="settings-field">
            <label>Gap</label>
            <input id="collageGap" type="number" value="10" min="0" max="80" class="num-sm">
          </div>
          <div class="settings-field">
            <label>Radius</label>
            <input id="collageRadius" type="number" value="10" min="0" max="80" class="num-sm">
          </div>
          <div class="settings-field">
            <label>BG</label>
            <input id="collageBg" type="color" value="#111111" class="color-sm">
          </div>
        </div>
      </div>
    </section>

    <!-- ========== FRAME STACK (the core) ========== -->
    <section class="stack-section">
      <div class="stack-head">
        <h2>Frame stack <small id="countLabel">0 / 200</small></h2>
        <div class="stack-head__actions">
          <button id="downloadCurrentBtn" data-icon="download" class="secondary" disabled title="Download current frame">Download frame</button>
        </div>
      </div>
      <div id="frameList" class="frame-list"></div>
    </section>

    <!-- ========== EXPORT BUTTON ========== -->
    <footer class="export-footer">
      <button id="downloadExportBtn" data-icon="download" class="export-btn wide" disabled>Download LineStack</button>
      <button id="clearBtn" data-icon="trash" class="ghost danger clear-btn">Clear all</button>
    </footer>

    <div class="footer-note">All frames and exports stay local in your browser.</div>
  </div>

  <!-- Collage block editor (slides in when a block is selected) -->
  <aside class="block-editor" id="blockEditor" hidden>
    <div class="block-editor__head">
      <strong id="blockTitle">Block</strong>
      <div style="display:flex;gap:6px;">
        <button class="ghost" id="blockReset" data-icon="reset">Reset</button>
        <button class="ghost" id="blockClose" title="Close">✕</button>
      </div>
    </div>
    <div class="block-editor__group" id="blockSizeGroup">
      <div class="settings-row">
        <div class="settings-field">
          <label>Width (cols) <span id="spanLabel">1</span></label>
          <input id="blockSpan" type="range" min="1" max="6" step="1" value="1">
        </div>
        <div class="settings-field">
          <label>Height <span id="heightLabel">1.0×</span></label>
          <input id="blockHeight" type="range" min="0.4" max="2.5" step="0.05" value="1">
        </div>
      </div>
    </div>
    <div class="settings-row">
      <div class="settings-field">
        <label>Zoom <span id="zoomLabel">1.0×</span></label>
        <input id="blockZoom" type="range" min="1" max="4" step="0.05" value="1">
      </div>
    </div>
    <div class="settings-row">
      <div class="settings-field">
        <label>Pan X</label>
        <input id="blockOffsetX" type="range" min="-1" max="1" step="0.02" value="0">
      </div>
      <div class="settings-field">
        <label>Pan Y</label>
        <input id="blockOffsetY" type="range" min="-1" max="1" step="0.02" value="0">
      </div>
    </div>
    <div class="block-editor__group">
      <div class="settings-row">
        <div class="settings-field settings-field--grow">
          <label>Caption <small id="frameCaptionHint"></small></label>
          <textarea id="frameCaption" rows="2" placeholder="Add caption…"></textarea>
        </div>
      </div>
      <div class="settings-row">
        <div class="settings-field">
          <label>Type</label>
          <select id="frameType"><option value="keyframe">Keyframe</option><option value="subtitle">Subtitle band</option></select>
        </div>
        <div class="settings-field">
          <label>Caption size <span id="frameCaptionScaleLabel">1.0×</span></label>
          <input id="frameCaptionScale" type="range" min="0.5" max="2" step="0.1" value="1">
        </div>
      </div>
      <div class="frame-editor__actions">
        <button class="ghost" id="frameEarlier" title="Move earlier">← Earlier</button>
        <button class="ghost" id="frameLater" title="Move later">Later →</button>
        <button class="danger" id="frameDelete">Delete</button>
      </div>
    </div>
  </aside>

  <!-- Floating frame zoom peek -->
  <div id="frameZoom" class="frame-zoom" hidden aria-hidden="true"></div>

  <script src="core.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
